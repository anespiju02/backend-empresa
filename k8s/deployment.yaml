apiVersion: apps/v1
kind: Deployment
metadata:
  name: empresa-backend
  namespace: empresa
  labels:
    app: empresa-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: empresa-backend
  template:
    metadata:
      name: empresa-backend
      labels:
        app: empresa-backend
    spec:
      containers:
        - name: empresa-backend
          image: registromiempresaafej01.azurecr.io/backendimagen:v4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
              name: http
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: empresa-backend-secrets
                  key: DB_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: empresa-backend-secrets
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: empresa-backend-secrets
                  key: DB_PASS
            - name: AZURE_AD_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: empresa-backend-secrets
                  key: TENANT_ID
            - name: AZURE_AD_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: empresa-backend-secrets
                  key: CLIENT_ID
            - name: AZURE_AD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: empresa-backend-secrets
                  key: CLIENT_SECRET
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,metrics,loggers"
            - name: MANAGEMENT_ENDPOINTS_HEALTH_PROBES_ENABLED
              value: "true"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /v1/api/empresa/actuator/health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /v1/api/empresa/actuator/health/readiness
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /v1/api/empresa/actuator/health/liveness
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: empresa-backend
  namespace: empresa
spec:
  type: LoadBalancer
  selector:
    app: empresa-backend
  ports:
    - name: http
      port: 80
      targetPort: 8085